name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'testnet'
        type: choice
        options:
          - testnet
          - mainnet
      deploy_contract:
        description: 'Deploy contract'
        required: false
        default: false
        type: boolean
      deploy_demo:
        description: 'Deploy demo app'
        required: false
        default: false
        type: boolean

env:
  RUST_VERSION: "1.79.0"
  NODE_VERSION: "18"

jobs:
  # ==========================================================================
  # Deploy Contract to Arbitrum
  # ==========================================================================
  deploy-contract:
    name: Deploy Contract
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_contract }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: contracts/paymaster

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Install cargo-stylus
        run: cargo install cargo-stylus --version 0.5.6 --locked

      - name: Build Contract
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Validate Contract
        run: cargo stylus check --endpoint ${{ vars.RPC_URL }}

      - name: Deploy Contract
        run: |
          cargo stylus deploy \
            --private-key ${{ secrets.DEPLOYER_PRIVATE_KEY }} \
            --endpoint ${{ vars.RPC_URL }}
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}

  # ==========================================================================
  # Deploy Demo to Vercel
  # ==========================================================================
  deploy-demo:
    name: Deploy Demo App
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_demo }}
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: demo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build
        env:
          VITE_PAYMASTER_ADDRESS: ${{ vars.PAYMASTER_ADDRESS }}
          VITE_TARGET_ADDRESS: ${{ vars.TARGET_ADDRESS }}
          VITE_RPC_URL: ${{ vars.RPC_URL }}
          VITE_CHAIN_ID: ${{ vars.CHAIN_ID }}

      - name: Deploy to Vercel
        run: |
          if [ "${{ inputs.environment }}" = "mainnet" ]; then
            vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --token ${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
